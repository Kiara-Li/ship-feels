<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>嗑点</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top-bar">
        <button type="button" class="icon-btn" id="btn-menu" aria-label="菜单">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <button type="button" class="top-bar__title" id="cp-title-btn" aria-label="编辑 CP 名称"></button>
        <input type="text" class="top-bar__title-input" id="cp-title-input" hidden />
        <button type="button" class="icon-btn" id="btn-more" aria-label="更多">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none" />
            <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none" />
            <circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none" />
          </svg>
        </button>
      </header>

      <main class="feed" id="feed" aria-label="嗑点列表"></main>

      <nav class="bottom-nav" aria-label="主导航">
        <div class="bottom-nav__item bottom-nav__item--active">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z" />
          </svg>
          <span data-i18n="home">主页</span>
        </div>
        <button type="button" class="bottom-nav__item" id="btn-search">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3-3" />
          </svg>
          <span data-i18n="search">搜索</span>
        </button>
        <button type="button" class="bottom-nav__item" id="btn-settings">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
            />
          </svg>
          <span data-i18n="settings">设置</span>
        </button>
      </nav>

      <button type="button" class="fab" id="fab-open-editor" aria-label="新建">
        <svg class="icon fab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>

      <!-- 编辑抽屉 -->
      <div class="overlay" id="editor-overlay" aria-hidden="true">
        <button type="button" class="overlay__backdrop" id="editor-backdrop" aria-label="关闭"></button>
        <div class="sheet sheet--editor" id="editor-panel" role="dialog" aria-modal="true" aria-labelledby="editor-heading">
          <div class="sheet__header">
            <span id="editor-heading" class="visually-hidden">编辑嗑点</span>
            <button type="button" class="sheet__mode" id="editor-mode-btn">
              <span data-i18n="editorModeImageText">图文</span>
              <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <button type="button" class="btn-primary" id="editor-done" data-i18n="editorDone">完成</button>
          </div>
          <div class="sheet__body">
            <div class="editor-block">
              <button type="button" class="editor-add-row" id="editor-add-image">
                <span class="editor-add-row__left">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                    <rect x="3" y="5" width="18" height="14" rx="2" />
                    <circle cx="8.5" cy="10" r="1.5" fill="currentColor" stroke="none" />
                    <path d="m21 15-5-5L7 21" />
                  </svg>
                  <span data-i18n="addImage">添加</span>
                </span>
                <span class="editor-add-row__plus" aria-hidden="true">
                  <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14" />
                  </svg>
                </span>
              </button>
              <div class="editor-image-slots" id="editor-image-slots" hidden></div>
            </div>

            <div class="editor-block">
              <div class="field field--quote">
                <input type="text" id="editor-quote" data-i18n-placeholder="quotePlaceholder" placeholder="在这里输入台词" />
              </div>
              <p class="field-label" data-i18n="quoteFrom">这句话来自——</p>
              <div class="char-row">
                <button type="button" class="char-btn" data-char="A" data-i18n="charA">角色A</button>
                <button type="button" class="char-btn" data-char="B" data-i18n="charB">角色B</button>
              </div>
            </div>

            <div class="editor-block">
              <div class="textarea-shell">
              <div class="textarea-shell__clip" aria-hidden="true">
                <div class="textarea-shell__highlight" id="editor-highlight"></div>
              </div>
              <textarea
                  id="editor-body"
                  class="textarea-shell__input"
                  rows="6"
                  data-i18n-placeholder="writePlaceholder"
                  placeholder="开始自由书写...使用 #标签# 来标记关键词"
                ></textarea>
              </div>
              <div class="tag-preview" id="editor-tag-preview" hidden></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 设置抽屉 -->
      <div class="overlay overlay--settings" id="settings-overlay" aria-hidden="true">
        <button type="button" class="overlay__backdrop" id="settings-backdrop" aria-label="关闭"></button>
        <div class="sheet sheet--settings" id="settings-panel" role="dialog" aria-modal="true">
          <div class="sheet__title-row">
            <h2 class="sheet__title" data-i18n="settingsTitle">设置</h2>
          </div>
          <div class="settings-body">
            <p class="settings-label" data-i18n="language">语言</p>
            <div class="lang-toggle" role="group" aria-label="语言">
              <button type="button" class="lang-toggle__btn is-active" data-locale="zh" data-i18n="languageZh">
                中文
              </button>
              <button type="button" class="lang-toggle__btn" data-locale="en" data-i18n="languageEn">English</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
